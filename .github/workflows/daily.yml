name: daily-shorts

on:
  schedule:
    - cron: "17 20 * * *"   # 毎日 05:17 JST（UTC 20:17）
  workflow_dispatch:
    inputs:
      count:
        description: "作るお題の数"
        default: "1"
      analytics_only:
        description: "YouTube の分析レポートだけ更新する（動画は作らない）"
        type: boolean
        default: false
      style:
        description: "映像スタイル（空欄=通常 / kamishibai=紙芝居・手描き風）"
        default: ""
      format:
        description: "台本の形式（空欄=日替わり / standard / quiz / myth）"
        default: ""
      rerender:
        description: "作り直す台本名（空白区切り、例: 2026-11-24_12 2026-11-24_13）。指定時は新規作成しない"
        default: ""
      upload_existing:
        description: "完成済みの動画を作り直さずアップロード（空白区切りの名前、例: 2026-11-24_08_gemini）"
        default: ""
      upload:
        description: "YouTube にアップロードする（毎朝の自動実行では常にアップロード）"
        type: boolean
        default: false
      compare:
        description: "比較モード（同じお題を Claude と Gemini の両方で台本化）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: daily-shorts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ["50021:50021"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Wait for VOICEVOX
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:50021/version && exit 0
            sleep 3
          done
          echo "VOICEVOX did not start"; exit 1

      - name: Fetch finished videos for upload-only
        if: ${{ github.event.inputs.upload_existing != '' && github.event.inputs.upload_existing != null }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          for n in ${{ github.event.inputs.upload_existing }}; do
            tag=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
                  --jq "[.[] | select(any(.assets[]; .name == \"$n.mp4\"))][0].tag_name")
            echo "$n <- $tag"
            [ -n "$tag" ] && [ "$tag" != "null" ] && gh release download "$tag" -R "${{ github.repository }}" -p "$n.*" -D output
          done
          ls -la output

      - name: Generate videos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          args="--count ${{ github.event.inputs.count || 1 }}"
          [ "${{ github.event.inputs.compare }}" = "true" ] && args="$args --compare"
          [ -n "${{ github.event.inputs.format }}" ] && args="$args --format ${{ github.event.inputs.format }}"
          [ -n "${{ github.event.inputs.style }}" ] && args="$args --style ${{ github.event.inputs.style }}"
          [ "${{ github.event.inputs.analytics_only }}" = "true" ] && args="$args --analytics-only"
          [ -n "${{ github.event.inputs.rerender }}" ] && args="$args --rerender ${{ github.event.inputs.rerender }}"
          [ -n "${{ github.event.inputs.upload_existing }}" ] && args="$args --upload-only ${{ github.event.inputs.upload_existing }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.upload }}" = "true" ]; then
            args="$args --upload"
          fi
          python daily.py $args

      - name: Save scripts and history
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add scripts history.json
          [ -d analytics ] && git add analytics
          [ -f dictionary.json ] && git add dictionary.json
          git diff --cached --quiet && exit 0
          git commit -m "daily: $(date -u +%F) scripts"
          # main may have moved while the video was rendering: rebase and retry
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "::warning::could not push scripts/history"

      - name: Publish release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(output/*.mp4)
          [ ${#files[@]} -eq 0 ] && { echo "no videos"; exit 0; }
          [ -f output/UPLOAD_ONLY ] && { echo "upload-only run: no new release"; exit 0; }
          tag="v$(TZ=Asia/Tokyo date +%Y%m%d-%H%M)"
          gh release create "$tag" output/*.mp4 output/*.json output/*.thumb.png \
            --title "$(TZ=Asia/Tokyo date +%Y-%m-%d) のショート" \
            --notes-file output/RELEASE_NOTES.md
