name: daily-shorts

on:
  schedule:
    - cron: "17 20 * * *"   # 毎日 05:17 JST（UTC 20:17）
  workflow_dispatch:
    inputs:
      count:
        description: "作るお題の数"
        default: "1"
      rerender:
        description: "作り直す台本名（空白区切り、例: 2026-11-24_12 2026-11-24_13）。指定時は新規作成しない"
        default: ""
      upload:
        description: "YouTube にアップロードする（毎朝の自動実行では常にアップロード）"
        type: boolean
        default: false
      compare:
        description: "比較モード（同じお題を Claude と Gemini の両方で台本化）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: daily-shorts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ["50021:50021"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Wait for VOICEVOX
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:50021/version && exit 0
            sleep 3
          done
          echo "VOICEVOX did not start"; exit 1

      - name: Generate videos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          args="--count ${{ github.event.inputs.count || 1 }}"
          [ "${{ github.event.inputs.compare }}" = "true" ] && args="$args --compare"
          [ -n "${{ github.event.inputs.rerender }}" ] && args="$args --rerender ${{ github.event.inputs.rerender }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.upload }}" = "true" ]; then
            args="$args --upload"
          fi
          python daily.py $args

      - name: Save scripts and history
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add scripts history.json
          [ -f dictionary.json ] && git add dictionary.json
          git diff --cached --quiet || (git commit -m "daily: $(date -u +%F) scripts" && git push)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(output/*.mp4)
          [ ${#files[@]} -eq 0 ] && { echo "no videos"; exit 0; }
          tag="v$(TZ=Asia/Tokyo date +%Y%m%d-%H%M)"
          gh release create "$tag" output/*.mp4 output/*.json output/*.thumb.png \
            --title "$(TZ=Asia/Tokyo date +%Y-%m-%d) のショート" \
            --notes-file output/RELEASE_NOTES.md
