name: reading-test

# 読み間違いチェックだけを試す（動画は作らない）
on:
  workflow_dispatch:
    inputs:
      lines:
        description: "確認したい文（| 区切り）"
        default: "1年のうちに朝が2回しか来ない計算です|輸出用はほぼこれ一択です"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ["50021:50021"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Wait for VOICEVOX
        run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:50021/version && exit 0; sleep 3; done; exit 1
      - name: Check readings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINES: ${{ github.event.inputs.lines }}
        run: |
          IFS='|' read -ra L <<< "$LINES"
          python -m factory.reading "${L[@]}"
